name: Publish app
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python3 standalone/build.py --base /vicaria
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: app/package-lock.json
      - run: npm ci
        working-directory: app
      - run: npm run build
        working-directory: app
        env:
          VIC_BASE: /vicaria/next/
      - run: cp -r app/dist standalone/dist/next
      - name: Get Vicaria page and installer
        run: |
          mkdir standalone/dist/get
          cp -r get/index.html get/pick.mjs get/media standalone/dist/get/
          cp get/install.sh standalone/dist/install.sh
      - uses: actions/upload-pages-artifact@v3
        with:
          path: standalone/dist
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
